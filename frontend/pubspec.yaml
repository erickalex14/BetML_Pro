name: frontend
description: BetML Pro — Motor de pronósticos deportivos con ML
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests a la API FastAPI
  http: ^1.2.0
  
  # Gestión de estado
  provider: ^6.1.2

  # Storage seguro del JWT
  flutter_secure_storage: ^9.2.2

  # Elegir imagen (galería/cámara en mobile, file picker en web) para
  # analizar-captura — no hay API nativa cross-platform sin paquete
  image_picker: ^1.1.2
  
  # Navegación
  go_router: ^14.0.0
  
  # UI components
  google_fonts: ^6.2.1
  
  # Iconos
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/

flutter_launcher_icons:
  image_path: "assets/logos/logo_icon.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/logos/logo_icon.png"
    background_color: "#01062B"
    theme_color: "#01062B"
  windows:
    generate: true