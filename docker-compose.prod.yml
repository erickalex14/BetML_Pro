# BetML Pro en el servidor — API + scheduler + Postgres.
#
# El .env NO va en la imagen (está gitignoreado y así debe quedar): se
# monta/lee desde el server. Ojo con DB_URL: adentro de Docker el host
# de la base es "db", no localhost.
services:
  betml-db:
    # 18 y no 16: tiene que coincidir con la versión de pg_dump que
    # genera el dump local, si no pg_restore rebota el archivo
    # ("unsupported version (1.16) in file header").
    image: postgres:18-alpine
    container_name: betml-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-betml}
    volumes:
      # En las imágenes 18+ el montaje va en /var/lib/postgresql (no en
      # .../data): adentro crean un subdirectorio por versión mayor para
      # que pg_upgrade funcione. Montar el path viejo hace que el
      # contenedor arranque y muera con "unused mount/volume".
      - betml-pgdata:/var/lib/postgresql
    ports:
      # SOLO 127.0.0.1: la base no queda expuesta a internet. Para
      # trabajar en local contra esta base se abre un túnel SSH
      # (ver README de deploy), que es lo mismo que hace el resto de
      # los stacks del server.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betml}"]
      interval: 10s
      timeout: 5s
      retries: 5

  betml-api:
    build: .
    image: betml-pro:latest
    container_name: betml-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Sin esto el contenedor corre en UTC: date.today() adelanta el
      # día 5 horas antes que acá y el pipeline pediría los fixtures de
      # mañana creyendo que son los de hoy.
      TZ: America/Guayaquil
    depends_on:
      betml-db:
        condition: service_healthy
    ports:
      # 8010 y no 8001: en el server 8001 ya lo usa novitec-sgn.
      # 0.0.0.0 (y no 127.0.0.1 como el resto de los stacks) porque el
      # APK entra desde afuera por IP:puerto — el resto de los servicios
      # de ese server salen por nginx, este todavía no. Ver README de
      # deploy: conviene moverlo detrás de un subdominio con HTTPS.
      - "${BETML_PUERTO:-8010}:8001"
    volumes:
      # Los modelos se reentrenan a diario y los escribe el scheduler —
      # volumen compartido para que la API sirva SIEMPRE la última
      # versión sin reconstruir la imagen.
      - betml-modelos:/app/data/models

  betml-scheduler:
    image: betml-pro:latest
    container_name: betml-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      # Crítico acá: schedule.every().day.at("03:00") usa la hora LOCAL
      # del sistema. En UTC el reentreno caería 22:00 de Guayaquil y
      # todos los jobs nocturnos correrían corridos 5 horas.
      TZ: America/Guayaquil
    depends_on:
      betml-db:
        condition: service_healthy
    command: ["python", "-m", "backend.scheduler.scheduler"]
    volumes:
      - betml-modelos:/app/data/models

volumes:
  betml-pgdata:
  betml-modelos:
